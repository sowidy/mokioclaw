[project]
name = "mokioclaw"
version = "0.1.0"
description = "A teaching-first mini CodeAgent built from ToolCall to Claw."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.15",
    "langchain-openai>=1.1.13",
    "langgraph>=1.1.6",
    "python-dotenv>=1.1.1",
    "rich>=15.0.0",
    "tavily>=1.1.0",
    "textual>=8.2.4",
    "typer>=0.16.0",
]

[project.scripts]
mokioclaw = "mokioclaw.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mokioclaw"]
